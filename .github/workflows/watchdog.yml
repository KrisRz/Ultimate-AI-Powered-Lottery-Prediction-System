name: Collection watchdog

# The morning-after check: is yesterday's draw actually in the data?
# A failed job is the alarm - GitHub's own failure notification - while the
# data is still recoverable from the official feed. The script sends no
# email itself, so it gets no SMTP secrets. EventBridge dispatches it at
# 12:05 UTC (infra/modules/draw-trigger); the cron below is the fallback.
on:
  schedule:
    - cron: "0 12 * * 0,4"   # Thu/Sun noon UTC
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements-ci.txt
      - name: Verify latest draw was collected
        run: PYTHONPATH=. python scripts/monitoring/collection_watchdog.py
