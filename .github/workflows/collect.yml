name: Collect draw data

# Two runs per draw: right after the Wed/Sat draw, plus a next-morning retry.
# Ingestion is idempotent (dedupe on draw_number+round+tier), so double runs
# are harmless and a single failed run is covered by the retry.
on:
  schedule:
    - cron: "45 21 * * 3,6"   # Wed/Sat 21:45 UTC - after the ~19:00 UTC draw
    - cron: "0 6 * * 0,4"     # Thu/Sun 06:00 UTC - retry
  workflow_dispatch:
    inputs:
      test_email:
        description: "Send a test email (verifies SMTP secrets)"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write    # to dispatch site-deploy - see "Publish the refreshed site"

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements-ci.txt

      - name: Fetch latest draw (official XML, idempotent ingest)
        run: |
          PYTHONPATH=. python -c "
          from scripts.fetch_data import download_fresh_data
          import sys
          sys.exit(0 if download_fresh_data() else 1)"

      # The pools are what make sales an identity rather than an estimate, and
      # for one day they were not being collected at all: the write sat in the
      # XML fallback instead of the JSON path, where `Element.get` returned
      # None and skipped it without raising. Healing them here rather than
      # trusting the ingest is the same argument as the 180-day self-heal for
      # draw data - and the verification below then has something to check.
      # Idempotent: it fetches only draws the file does not already hold.
      - name: Backfill any missing draw pools
        run: PYTHONPATH=. python scripts/backfill_draw_pools.py

      # download_fresh_data() returns True even when the network fails and it
      # falls back to cached data - verify we actually hold the expected draw,
      # so a quiet no-op run turns into a loud red one.
      - name: Verify collected data is fresh
        run: |
          PYTHONPATH=. python - <<'EOF'
          import sys
          from datetime import date, datetime
          import pandas as pd
          from scripts.monitoring.collection_watchdog import most_recent_draw_date

          today = date.today()
          expected = today if today.weekday() in (2, 5) else most_recent_draw_date()
          tiers = pd.read_csv("data/prize_tiers.csv")
          latest = max(datetime.strptime(d, "%Y-%m-%d").date() for d in tiers["draw_date"])
          print(f"latest collected: {latest}, expected: {expected}")
          sys.exit(0 if latest >= expected else 1)
          EOF

      # Scores the model against the draw when it was a Must-Be-Won (~9/year):
      # measured sales vs forecast, advertised pool vs actual redistribution.
      # Runs before the commit so its scorecard CSV rides the same push.
      - name: Score the model after a Must-Be-Won draw
        env:
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: PYTHONPATH=. python scripts/monitoring/post_mbw_validation.py

      # The public page quotes this model, and until now only a human running
      # `make site-data` moved it - so it published draw 3196 for a fortnight
      # while the collector kept working. Regenerating here puts the snapshot on
      # the same schedule as the data it describes.
      #
      # Safe to run unattended because the exporter is deterministic and reads
      # only collected data: unchanged inputs give a byte-identical file and
      # nothing to commit. The review this used to get was really a guard against
      # MODEL drift, and that is CI's `--check` on pull requests - a code change
      # that moves these figures cannot land without moving the snapshot with it.
      - name: Refresh the public site snapshot
        run: PYTHONPATH=. python scripts/export_site_data.py

      - name: Commit collected data and the site snapshot
        id: commit
        run: |
          git config user.name "lotto-collector[bot]"
          git config user.email "actions@users.noreply.github.com"
          git add -f data/prize_tiers.csv data/merged_lottery_data.csv data/lotto_full_history.csv
          git add -f data/draw_pools.csv 2>/dev/null || true
          git add -f data/mbw_validation.csv 2>/dev/null || true
          git add site/public/data/site.json site/src/__fixtures__/popularity-golden.json
          # Whether the PAGE moved is a separate question from whether anything
          # did: a rerun that only rewrites a CSV byte needs no CloudFront
          # invalidation. Read off the index, before the commit consumes it.
          if git diff --cached --quiet -- site/; then
            echo "site_changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "site_changed=true" >> "$GITHUB_OUTPUT"
          fi
          if git diff --cached --quiet; then
            echo "No new data (already collected - idempotent run)"
          else
            git commit -m "data: collect draw $(date -u +%Y-%m-%d)"
            git pull --rebase origin main
            git push
          fi

      # A push made with GITHUB_TOKEN does not raise `push` events, which is why
      # site-deploy.yml has never once seen the collector's commit even though it
      # watches `site/**`. workflow_dispatch is one of the two events GitHub does
      # deliver from that token, so ask for the deploy by name instead of hoping
      # the push trigger fires.
      - name: Publish the refreshed site
        if: steps.commit.outputs.site_changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run site-deploy.yml --ref main

      # The one failure this repo could not see: a run that never happened.
      # GitHub notifies on a FAILED run and says nothing about a skipped one,
      # and its cron has been dropping and delaying runs platform-wide since
      # late August 2026 (measured: 13-58 min late through 23 Aug, 2-11 h
      # since). A dead-man ping inverts the test - healthchecks.io alerts when
      # the ping does NOT arrive by its deadline, so silence becomes the alarm
      # instead of the default.
      #
      # Set HEALTHCHECK_URL (repo secret) to the check's ping URL, with a
      # period of one draw and a grace long enough for the retry run. Without
      # the secret this step is a no-op, so a fork or a fresh clone is not
      # broken by its absence.
      - name: Dead-man ping
        if: success()
        env:
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
        run: |
          if [ -n "$HEALTHCHECK_URL" ]; then
            curl -fsS --retry 3 --max-time 10 "$HEALTHCHECK_URL" && echo "pinged"
          else
            echo "HEALTHCHECK_URL not set - skipping (see the comment above)"
          fi

      - name: EV verdict + email alert on PLAY
        env:
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EV_ALERT_TEST: ${{ github.event.inputs.test_email == 'true' && '1' || '0' }}
        run: PYTHONPATH=. python scripts/monitoring/ev_alert.py

      # Deliberately LAST. A stall in the pools does not show up in
      # the tier data at all - that data was complete and correct the whole time
      # the pools were frozen, which is exactly how it went unnoticed - so it
      # needs its own check. But it must not gate the commit: if the JSON API is
      # down the XML fallback still collects the draw, and the pools cannot
      # advance because the backfill reads the same JSON. Gating the commit
      # would turn a successful fallback collection into a discarded one, and
      # gating the alert would let a stale pool file suppress a PLAY email -
      # the one output that has to survive everything. So: do the work, send
      # the mail, then go red and say which file is behind.
      - name: Verify the pools kept up
        run: |
          PYTHONPATH=. python - <<'EOF'
          import sys
          from pathlib import Path
          import pandas as pd

          pools_file = Path("data/draw_pools.csv")
          if not pools_file.exists():
              print(f"{pools_file} is missing - run scripts/backfill_draw_pools.py")
              sys.exit(1)
          tiers = pd.read_csv("data/prize_tiers.csv")
          pools = pd.read_csv(pools_file)
          highest_tier = int(tiers["draw_number"].max())
          highest_pool = int(pools["draw_number"].max())
          print(f"pools reach draw {highest_pool}, tiers reach {highest_tier}")
          if highest_pool < highest_tier:
              print("draw_pools.csv is behind - the identity that prices every "
                    "Must-Be-Won draw is going stale. The draw data above was "
                    "collected and committed; this run is red for the pools only.")
              sys.exit(1)
          EOF
