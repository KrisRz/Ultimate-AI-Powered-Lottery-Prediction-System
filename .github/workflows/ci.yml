name: CI

on:
  push:
    branches: [main, "cleanup/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: pip install pandas numpy requests pytest
      - name: Run tests
        run: PYTHONPATH=. python -m pytest -q
