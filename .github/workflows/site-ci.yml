name: Site CI

on:
  pull_request:
    paths:
      - 'site/**'
      - '.github/workflows/site-ci.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: site/.nvmrc
          cache: npm
          cache-dependency-path: site/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

      # Guards the part of the bundle this project controls. The framework
      # floor is what it is; app code creeping past its budget is a choice
      # someone made, usually by importing a whole library for one function.
      - run: npm run size
